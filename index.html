<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf6f1" />
    <meta name="color-scheme" content="light dark" />
    <title>Bookmark Manager - Import, Export & Organize</title>
    <meta
      name="description"
      content="A simple bookmark manager that works offline. Import and export Chrome bookmarks, organize by folders, and access anywhere."
    />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts for custom typography options -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('theme');
          var isDark =
            storedTheme === 'dark' ||
            (!storedTheme &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var primaryColor = localStorage.getItem('primary_color');
          if (primaryColor) {
            var cleanHex = primaryColor.replace('#', '');
            if (cleanHex.length === 3) {
              cleanHex = cleanHex
                .split('')
                .map(function (c) {
                  return c + c;
                })
                .join('');
            }
            var num = parseInt(cleanHex, 16);
            if (!isNaN(num)) {
              var r = (num >> 16) & 255;
              var g = (num >> 8) & 255;
              var b = num & 255;
              var lightColor = 'rgba(' + r + ', ' + g + ', ' + b + ', 0.18)';

              var hr = Math.min(255, Math.max(0, r + Math.round(255 * -0.1)));
              var hg = Math.min(255, Math.max(0, g + Math.round(255 * -0.1)));
              var hb = Math.min(255, Math.max(0, b + Math.round(255 * -0.1)));
              var hoverColor =
                '#' + ((1 << 24) + (hr << 16) + (hg << 8) + hb).toString(16).slice(1);

              var root = document.documentElement;
              root.style.setProperty('--color-primary-orange', primaryColor);
              root.style.setProperty('--color-primary-orange-hover', hoverColor);
              root.style.setProperty('--color-primary-orange-light', lightColor);
            }
          }

          var fontFamily = localStorage.getItem('font_family');
          if (fontFamily) {
            document.documentElement.style.fontFamily = fontFamily;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
